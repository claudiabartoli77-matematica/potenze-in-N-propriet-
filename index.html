:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#182640;background:#f4f2fd}*{box-sizing:border-box}body{margin:0}header{background:#231c57;color:white;padding:15px 5vw;display:flex;justify-content:space-between;gap:10px;align-items:center}header strong{font-size:1.15rem}button{cursor:pointer;font:inherit;border:0;border-radius:12px;padding:12px 18px;background:#6b41d9;color:white;font-weight:700}button:disabled{background:#a9a6b4;cursor:not-allowed}.ghost{background:#eee8ff;color:#35246f}.wrap{max-width:960px;margin:24px auto;padding:0 16px 80px}.card{background:white;border-radius:22px;padding:clamp(20px,4vw,38px);box-shadow:0 8px 30px #30235a15}.eyebrow{color:#704ad0;font-weight:800;text-transform:uppercase;letter-spacing:.11em;font-size:.8rem}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.12;margin:.3em 0}h2{margin:.3em 0}p{line-height:1.55}video{display:block;width:100%;border-radius:16px;background:#211c47;max-height:480px}.intro-frame{width:fit-content;max-width:100%;margin:20px auto;border-radius:20px;overflow:hidden;background:#211c47;box-shadow:0 15px 35px #27215b32}.intro-frame video{width:auto;max-width:100%;height:min(65vh,590px);aspect-ratio:9/16;object-fit:contain}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.progress{height:9px;border-radius:9px;background:#ddd5f2;margin:16px 0 25px;overflow:hidden}.progress span{display:block;height:100%;background:#8b5cf6}.cover{position:relative;display:block;width:min(100%,650px);padding:0;margin:20px auto;border:0;background:#26185b;overflow:hidden;border-radius:17px;aspect-ratio:16/9}.cover img{width:100%;height:100%;object-fit:contain}.cover .play{position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:2.8rem;text-shadow:0 2px 12px black}.embed{width:100%;aspect-ratio:16/9;border:0;border-radius:15px}.notice{background:#f1eafe;border-left:4px solid #8555ed;padding:14px 16px;border-radius:8px}.question{border:1px solid #ddd5f2;border-radius:16px;padding:18px;margin:14px 0}.question h3{margin:0 0 12px;font-size:1.12rem}.choice{display:block;padding:10px 12px;margin:7px 0;background:#faf8ff;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#e5d9ff;outline:2px solid #7652d8}.choice input{margin-right:10px}.feedback{padding:15px;border-radius:12px;margin:14px 0;background:#eaf7ee}.feedback.bad{background:#ffedee}.summary{font-size:1.3rem;font-weight:800}.small{font-size:.9rem;color:#555}.result-hero{text-align:center;background:linear-gradient(145deg,#faf6ff,#fff5fb);border:1px solid #e7d7ff;border-radius:22px;padding:24px;margin-bottom:22px}.result-hero.excellent{background:linear-gradient(135deg,#fff5fb,#fce7ff,#fff3fa);box-shadow:0 0 30px #f589ce7d}.mate-face{width:clamp(130px,28vw,210px);height:auto;display:block;margin:auto;filter:drop-shadow(0 8px 10px #65418736)}.result-hero.excellent .mate-face{animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-7px)}}.spectrum-wrap{max-width:760px;margin:30px auto}.spectrum{height:30px;border-radius:50px;position:relative;background:linear-gradient(to right,#ef4444 0% 20%,#fb923c 20% 40%,#facc15 40% 60%,#34ad64 60% 70%,#38bdf8 70% 80%,#a855f7 80% 90%,#ff74c9 90% 100%);box-shadow:inset 0 2px 6px #0002}.spectrum.excellent:after{content:'✦ ✧ ✦ ✧';position:absolute;right:1%;top:-11px;color:white;text-shadow:0 0 8px #f526a2;font-size:23px;animation:twinkle 1.2s alternate infinite}@keyframes twinkle{to{opacity:.25;transform:scale(1.08)}}.marker{position:absolute;top:-11px;left:clamp(0px,var(--score),100%);transform:translateX(-50%);height:50px;width:5px;background:#21164c;border-radius:4px;box-shadow:0 0 0 3px white}.scale-labels{display:flex;justify-content:space-between;font-weight:700;color:#33285c;margin-top:8px;font-size:.82rem}.score-legend{text-align:center;margin-top:10px;color:#453663}.result-note{margin:14px auto;max-width:590px}.result-hero h1{margin:.4em 0}.result-hero .summary{font-size:clamp(1.3rem,4vw,2rem);color:#342169}footer{text-align:center;margin:30px}.pill{border-radius:30px;background:#eee8ff;padding:8px 13px;font-weight:700}sup{line-height:0}@media(max-width:600px){header{flex-direction:column;align-items:flex-start}}
</style></head><body><header><strong>✦ In classe con Matica · Le potenze</strong><span id="headstatus"></span></header><main class="wrap" id="app"></main><footer><button class="ghost" onclick="privacy()">Informativa privacy</button></footer><script>
const lessons=[
 {title:'Prima proprietà',subtitle:'Prodotto di potenze con la stessa base',id:'d5Yg7hD-m8g',cover:'1-proprietà potenze.png',rule:'aᵐ · aⁿ = aᵐ⁺ⁿ',items:[['3² · 3⁴ = ?',['3⁶','3⁸','6⁶','9⁸'],0],['2⁷ · 2⁸ = ?',['2¹⁵','2⁵','4¹⁵','2⁵⁶'],0],['4² · 4 = ?',['4³','4²','4⁴','8³'],0],['5⁸ · 5 = ?',['5⁹','5⁸','5⁷','25⁸'],0]]},
 {title:'Seconda proprietà',subtitle:'Quoziente di potenze con la stessa base',id:'gq_EukK4m90',cover:'2-proprietà potenze.png',rule:'aᵐ : aⁿ = aᵐ⁻ⁿ (a ≠ 0, m ≥ n)',items:[['5⁶ : 5⁴ = ?',['5²','5¹⁰','1²','5⁴'],0],['2⁷ : 2⁵ = ?',['2²','2¹²','1²','2³⁵'],0],['4³ : 4² = ?',['4¹ = 4','4⁵','4⁶','1'],0],['10⁸ : 10⁶ = ?',['10²','10¹⁴','1²','10⁴⁸'],0]]},
 {title:'Terza proprietà',subtitle:'Potenza di una potenza',id:'2DC8I742Fo4',cover:'3-proprietà potenze.png',rule:'(aᵐ)ⁿ = aᵐ·ⁿ',items:[['(3²)⁴ = ?',['3⁸','3⁶','3¹⁶','9⁸'],0],['(5²)² = ?',['5⁴','5²','5⁸','10⁴'],0],['(2⁶)² = ?',['2¹²','2⁸','2⁴','4¹²'],0],['(4³)² = ?',['4⁶','4⁵','4⁹','12⁶'],0],['(1⁵)³ = ?',['1¹⁵ = 1','1⁸','1²','15'],0],['(8²)⁷ = ?',['8¹⁴','8⁹','8⁵','16¹⁴'],0]]},
 {title:'Quarta proprietà',subtitle:'Prodotto di potenze con lo stesso esponente',id:'5eq8-VW4jRE',cover:'4-proprietà potenze.png',rule:'aⁿ · bⁿ = (a · b)ⁿ',items:[['2³ · 4³ = ?',['8³','6³','8⁶','2¹²'],0],['3³ · 4³ = ?',['12³','7³','12⁶','3¹²'],0],['5² · 3² = ?',['15²','8²','15⁴','5⁶'],0],['7⁶ · 2⁶ = ?',['14⁶','9⁶','14¹²','7¹²'],0]]},
 {title:'Quinta proprietà',subtitle:'Quoziente di potenze con lo stesso esponente',id:'O5gv-zk_93Y',cover:'5-proprietà potenze.png',rule:'aⁿ : bⁿ = (a : b)ⁿ (b ≠ 0)',items:[['8⁴ : 4⁴ = ?',['2⁴','4⁴','2⁰','8⁰'],0],['12⁵ : 6⁵ = ?',['2⁵','6⁵','2⁰','12⁰'],0],['10⁸ : 1⁸ = ?',['10⁸','10⁰','9⁸','1⁸'],0],['15³ : 3³ = ?',['5³','12³','5⁰','15⁰'],0]]},
 {title:'Lo zero e le potenze',subtitle:'Esponente zero, base zero ed esponente uno',id:'BZ3p0dVHo9o',cover:null,rule:'a⁰ = 1 se a ≠ 0; 0ⁿ = 0 se n > 0; a¹ = a; 0⁰ è indeterminato',items:[['9⁰ = ?',['1','0','9','indeterminato'],0],['0⁶ = ?',['0','1','6','indeterminato'],0],['5¹ = ?',['5','1','0','25'],0],['0⁰ è…',['indeterminato','uguale a 1','uguale a 0','uguale a 00'],0]]}
, {title:'Esercizi finali',subtitle:'Completa le uguaglianze e riconosci gli errori',id:null,cover:null,rule:'Usa insieme le cinque proprietà e i casi particolari delle potenze.',items:[
 ['7⁰ = 5^□. Completa l’esponente.',['0','1','5','7'],0],['(2³)² = (2²)^□. Completa.',['3','2','6','4'],0],['(2³)² · 2^□ = 2⁷. Completa.',['1','2','3','0'],0],
 ['3⁴ − 4³ = (□)¹. Completa la base.',['17','81','64','145'],0],['(1⁶)^□ = 5⁰. Quale valore funziona?',['3','Nessuno','Solo 0','Solo 1'],0],['(15^□)² : 15 = 15⁵. Completa.',['3','2','5','6'],0],
 ['□³ · □³ = 6³. Quale coppia funziona?',['2 e 3','1 e 3','2 e 6','3 e 3'],0],['(7³)⁴ : 7^□ = 7⁷. Completa.',['5','7','12','3'],0],['(3^□)⁴ = 3²⁴. Completa.',['6','20','28','4'],0],
 ['3⁴ : 3^□ = 3⁴. Completa.',['0','1','4','8'],0],['(18 : 3)³ = 18³ : □. Completa.',['3³','3','18³','3⁶'],0],['(2 · 4 · 5²)² = ?',['2² · 4² · 5⁴','2² · 4² · 5²','2 · 4 · 5⁴','2⁴ · 4⁴ · 5⁴'],0],
 ['Vero o falso? 5⁴ · 5² = 5⁶',['Vero','Falso'],0],['Vero o falso? 5⁴ + 5² = 5⁶',['Falso','Vero'],0],['Vero o falso? (2²)³ = 2⁵',['Falso','Vero'],0],['Vero o falso? 2⁸ = 2⁴ + 2⁴',['Falso','Vero'],0],['Vero o falso? 3⁹ = 3⁵ · 3⁴',['Vero','Falso'],0],['Vero o falso? 2⁸ = (2²)⁴',['Vero','Falso'],0]
 ]}
];
// Le venti domande sono trascritte dal PDF allegato, con notazione e risposte rilette visivamente.
const test=[
 ['Qual è la scrittura corretta per 5³ · 7³?',['12³','35⁰','35⁹','35³','35⁶'],3],
 ['(7²) · (7³) : (7⁵) è uguale a',['7³','7⁴','7⁻¹','7⁶','7⁰'],4],
 ['(5⁹) : (5³) : (5²) è uguale a',['5⁴','5¹⁰','5¹⁴','5⁻⁷','5⁻¹⁰'],0],
 ['(5²) · (2²) · (4²) è uguale a',['40²','40⁴','40⁶','40⁸','2¹¹'],0],
 ['(3 · 2)² =',['2² + 3²','3² − 2²','2² · 3²','2² − 3²','1'],2],
 ['(15 × 3)⁷ = 15⁷ × 3⁷',['Vero','Falso'],0],
 ['2³ · 2ˣ = 2⁵. Quanto vale x?',['0','1','2','3','4'],2],
 ['7² · 7² · 7ˣ = 7⁷. Quanto vale x?',['0','1','2','3','4'],3],
 ['Zero alla zero (0⁰) è…',['pari a 1','pari a 0','impossibile','indeterminato','privo di significato'],3],
 ['Qualsiasi potenza con esponente 0 e base diversa da 0 è…',['pari all’esponente','pari alla base','pari a 0','pari a 1','priva di significato'],3],
 ['(8⁶) : (8³) è uguale a',['8⁶','8³','8²','8⁹','8¹⁸'],1],
 ['(5⁷)² è uguale a',['5⁷','5²','5⁹','5⁴⁹','5¹⁴'],4],
 ['Il quoziente di potenze aventi la stessa base è una potenza…',['con la stessa base e somma degli esponenti','con la stessa base e differenza degli esponenti','con la stessa base e prodotto degli esponenti','con lo stesso esponente e prodotto delle basi','con lo stesso esponente e quoziente delle basi'],1],
 ['Il quoziente di potenze con lo stesso esponente è una potenza…',['con la stessa base e somma degli esponenti','con la stessa base e differenza degli esponenti','con la stessa base e prodotto degli esponenti','con lo stesso esponente e prodotto delle basi','con lo stesso esponente e quoziente delle basi'],4],
 ['Qualsiasi potenza con esponente 1 è…',['pari all’esponente','pari alla base','pari a 0','pari a 1','priva di significato'],1],
 ['Qual è la scrittura errata?',['5⁰ = 1','1⁰ = 1','2⁴ = 2 + 2 + 2 + 2','0³ = 0','4³ = 4 · 4 · 4'],2],
 ['Qual è la scrittura errata?',['3⁰ = 1','1²⁰ = 1','0⁵ = 0','2³ = 2 · 3','5² = 5 · 5'],3],
 ['(15⁵)⁴ =',['15⁵⁻⁴','15²⁰','15⁵⁺⁴','15⁴⁻⁵','4¹⁵⁻⁹'],1],
 ['13⁵ · 13 =',['13⁵⁻¹','13⁵ · ¹','13⁵⁺¹','5¹³⁺¹','1¹³⁺¹'],2],
 ['(3 · 2)² =',['2² + 3²','2² · 3²','2² − 3²','5²','2⁷'],1]
];
const app=document.querySelector('#app'),head=document.querySelector('#headstatus');let step=-1,stage='video',orders={},choiceOrders={},done={},answers={},testOrder=[],testChoices={},testAnswers={},previous=null;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function fmt(s){return s.replaceAll('⁺','⁺').replaceAll('⁻','⁻')}
function shell(inner){head.textContent=step<0?'Benvenuta/o':step<lessons.length?`Tappa ${step+1} di ${lessons.length}`:'Test finale';app.innerHTML='<div class="card">'+inner+'</div>';window.scrollTo(0,0)}
function start(){step=-1;shell(`<div class="eyebrow">Il percorso</div><h1>Le proprietà delle potenze</h1><p>Matica ti accompagna attraverso cinque proprietà, lo zero, un allenamento riepilogativo e un test finale.</p><div class="intro-frame"><video id="intro" src="Matica-intro.mp4" preload="auto" controls playsinline aria-label="Introduzione di Matica"></video></div><div class="notice"><strong>Come funziona:</strong> guarda ogni video o leggi la sintesi, svolgi tutti gli esercizi della tappa e controlla le risposte. Le domande cambiano ordine all'interno di ogni batteria. Nel test finale serve almeno il 60%.</div><div class="actions"><button onclick="openStep(0)">Inizia il percorso →</button></div>`);document.querySelector('#intro').load()}
function openStep(n){step=n;stage='video';renderStep()}
function renderStep(){const l=lessons[step];let media=!l.id?'':l.cover?`<button class="cover" onclick="loadYoutube()" aria-label="Avvia il video ${l.title}"><img src="${l.cover}" alt="Copertina: ${l.title}"><span class="play">▶</span></button>`:`<button class="cover" onclick="loadYoutube()" aria-label="Avvia il video sullo zero"><span class="play">▶<br><small>Lo zero e le potenze</small></span></button>`;
shell(`<div class="eyebrow">Tappa ${step+1} di ${lessons.length}</div><h1>${l.title}</h1><p>${l.subtitle}</p><div class="progress"><span style="width:${step/lessons.length*100}%"></span></div><div id="media">${media}</div>${l.id?'<p class="small">YouTube si carica solo dopo aver premuto la copertina. In quel momento YouTube può trattare dati secondo la propria informativa.</p>':''}<details><summary><strong>${step<5?'Guarda la formula':step===5?'Leggi la sintesi del contenuto':'Ripassa le regole'}</strong></summary><p>${l.rule}</p></details><div class="actions"><button onclick="renderExercises()">Vai agli esercizi →</button>${step?'<button class="ghost" onclick="openStep(step-1)">← Tappa precedente</button>':''}</div>`)}
function loadYoutube(){let l=lessons[step];document.querySelector('#media').innerHTML=`<iframe class="embed" src="https://www.youtube-nocookie.com/embed/${l.id}?autoplay=1" title="${l.title}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
function renderExercises(){stage='exercise';let l=lessons[step];if(!orders[step])orders[step]=shuffle(l.items.map((_,i)=>i));if(!choiceOrders[step])choiceOrders[step]=l.items.map(q=>shuffle(q[1].map((_,i)=>i)));let html=`<div class="eyebrow">Tappa ${step+1} · allenamento</div><h1>${l.title}</h1><p>${l.rule}</p><p>Completa i ${l.items.length} esercizi. Dopo la verifica puoi correggere e riprovare.</p>`;orders[step].forEach((idx,pos)=>{let q=l.items[idx],sel=answers[step]?.[idx];html+=`<div class="question"><h3>Esercizio ${lessons.slice(0,step).reduce((n,x)=>n+x.items.length,0)+pos+1}. ${q[0]}</h3>${choiceOrders[step][idx].map(k=>`<label class="choice"><input type="radio" name="q${idx}" value="${k}" ${sel===k?'checked':''} onchange="pick(${idx},${k})">${q[1][k]}</label>`).join('')}</div>`});html+=`<div id="exerciseResult"></div><div class="actions"><button onclick="checkExercises()">Controlla le risposte</button><button class="ghost" onclick="renderStep()">← Video e sintesi</button></div>`;shell(html)}
function pick(i,k){(answers[step]??={})[i]=k}
function checkExercises(){let l=lessons[step],a=answers[step]||{};if(Object.keys(a).length<l.items.length){document.querySelector('#exerciseResult').innerHTML='<p class="feedback bad">Rispondi a tutti gli esercizi prima di controllare.</p>';return}let errors=orders[step].filter(i=>a[i]!==l.items[i][2]);let msg=errors.length?`Hai risposto correttamente a ${l.items.length-errors.length}/${l.items.length}. Rivedi: ${errors.map(i=>'esercizio '+(lessons.slice(0,step).reduce((n,x)=>n+x.items.length,0)+orders[step].indexOf(i)+1)+' → '+l.items[i][1][l.items[i][2]]).join('; ')}.`:`Ottimo! ${l.items.length}/${l.items.length} risposte corrette.`;done[step]=true;document.querySelector('#exerciseResult').innerHTML=`<div class="feedback ${errors.length?'bad':''}" role="status">${msg}</div><button onclick="${step===lessons.length-1?'beginTest()':'openStep(step+1)'}">${step===lessons.length-1?'Vai al test finale →':'Prosegui →'}</button>`}
function beginTest(){step=lessons.length;testOrder=shuffle(test.map((_,i)=>i));testAnswers={};testChoices=test.map(q=>shuffle(q[1].map((_,i)=>i)));renderTest()}
function renderTest(){let html=`<div class="eyebrow">Verifica conclusiva</div><h1>Test sulle proprietà delle potenze</h1><p>20 quesiti in ordine casuale, ciascuno da un punto. Serve almeno 12/20 per superare la prova. Puoi riprovare.</p><div class="progress"><span style="width:100%"></span></div>`;testOrder.forEach((idx,pos)=>{let q=test[idx];html+=`<div class="question"><h3>${pos+1}. ${q[0]}</h3>${testChoices[idx].map(k=>`<label class="choice"><input type="radio" name="t${idx}" onchange="testAnswers[${idx}]=${k}">${q[1][k]}</label>`).join('')}</div>`});html+=`<div id="testResult"></div><div class="actions"><button onclick="grade()">Concludi e verifica</button><button class="ghost" onclick="openStep(lessons.length-1)">← Ripassa gli esercizi</button></div>`;shell(html)}
function grade(){
 if(Object.keys(testAnswers).length!==test.length){document.querySelector('#testResult').innerHTML='<p class="feedback bad">Rispondi a tutte e 20 le domande.</p>';return}
 const score=test.reduce((n,q,i)=>n+(testAnswers[i]===q[2]),0),pct=score*5;
 const level=score<12?'Da rivedere':score===20?'Eccellente':pct>=80?'Ottimo':pct>=70?'Buono':'Sufficiente';
 const face=pct<60?'Mate-triste.png':pct<80?'Mate-sorriso.png':'Mate-euforica.png';
 const encouragement=pct<60?'Mate ti invita a ripassare le proprietà e riprovare.':pct<80?'Bene! Hai superato il test: continua ad allenarti.':'Fantastico! Hai raggiunto un risultato molto alto.';
 const review=testOrder.map((idx,i)=>testAnswers[idx]!==test[idx][2]?`<li>Domanda ${i+1}: ${test[idx][0]}<br>Risposta corretta: <strong>${test[idx][1][test[idx][2]]}</strong></li>`:'').join('');
 shell(`<div class="eyebrow">Risultato del test</div><section class="result-hero ${pct>=90?'excellent':''}"><img class="mate-face" src="${face}" alt="Mate ${pct<60?'triste':pct<80?'sorridente':'euforica'}"><h1>${score>=12?'Percorso completato!':'Puoi riprovare'}</h1><p class="summary">${score}/20 · ${pct}% · livello ${level}</p><p class="result-note">${encouragement}</p><div class="spectrum-wrap"><div class="spectrum ${pct>=90?'excellent':''}" role="img" aria-label="Scala dei livelli: rosso 0-20, arancione 20-40, giallo 40-60, verde 60-70, azzurro 70-80, viola 80-90, rosa scintillante 90-100. Risultato ${pct} per cento"><span class="marker" style="--score:${pct}%"></span></div><div class="scale-labels"><span>0%</span><span>20%</span><span>40%</span><span>60%</span><span>80%</span><span>100%</span></div><p class="score-legend">Rosso · Arancio · Giallo · Verde · Azzurro · Viola · Rosa scintillante</p></div><p>${score>=12?'Hai superato il test.':'Per superare il test occorrono almeno 12 risposte corrette.'}</p></section>${review?`<details><summary>Rivedi le risposte da correggere</summary><ol>${review}</ol></details>`:'<p class="feedback">Tutte le risposte sono corrette!</p>'}<div class="actions"><button onclick="beginTest()">Ripeti il test</button><button class="ghost" onclick="openStep(0)">Riparti dalla prima proprietà</button></div>`)
}
function privacy(){previous=app.innerHTML;shell(`<div class="eyebrow">Dati personali</div><h1>Informativa privacy</h1><p>Questa app non richiede registrazione e non invia le risposte a un server: esercizi, verifiche e risultati sono elaborati nel browser. Il percorso rimane solo nella pagina aperta e si azzera ricaricandola.</p><p>Se l’app è pubblicata su GitHub Pages, GitHub può trattare i dati tecnici necessari a mostrare il sito. I video YouTube vengono caricati soltanto quando scegli di avviarli dalla copertina; il collegamento usa il dominio youtube-nocookie.com. Da quel momento YouTube può trattare dati tecnici e applicare le proprie condizioni. Il video introduttivo è ospitato insieme all’app.</p><p>Per domande sulla privacy, contatta l’autrice attraverso i recapiti presenti sul sito <a href="https://sites.google.com/view/matematicadibasefacile" target="_blank" rel="noopener">Matematica di base facile</a>.</p><button onclick="app.innerHTML=previous;previous=null">Torna all’app</button>`)}
start();
</script></body></html>
